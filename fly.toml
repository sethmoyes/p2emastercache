# fly.toml app configuration file generated for p2emastercache2 on 2026-06-24T19:25:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'p2emastercache2'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Everything the app writes (restocked shops, traveling merchants, map pins, the
# GM's dice jar and history) lives on this volume; a machine's own disk resets
# to the image every time it stops. A volume belongs to one machine, so keep one
# machine. The GM page's "Download backup" zips it for committing to git.
[env]
  DATA_DIR = '/data'

[mounts]
  source = 'merchant_data'
  destination = '/data'

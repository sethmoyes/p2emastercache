[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avtools"
version = "1.0.0"
description = "Abomination Vaults campaign tools: dungeon turn, Otari merchants, and the web app"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["avtools*"]

[tool.setuptools.package-data]
avtools = ["web/templates/*.html", "web/static/**/*"]
